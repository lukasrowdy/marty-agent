<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1311">
<title>Marty - offline</title>
<!-- Served by the service worker (sw.js) when a page load fails with no network. Public file:
     cached before login, so it carries no personal text, no paths, no token, and no script
     beyond the retry. -->
<style>
:root{--bg:#0b1311;--panel:#101c19;--text:#f2ece0;--sub:#a9b1ab;--line:rgba(242,236,224,.1);--teal2:#2f7a72}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:min(380px,100%);padding:26px 22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;text-align:center}
.orb{display:inline-block;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 42% 35%,#baf8ec 0,#4fb3a4 24%,#205a52 55%,#102420 74%);opacity:.55}
h1{font:24px Georgia,serif;margin:14px 0 8px}p{color:var(--sub);line-height:1.5;margin:0 0 18px;font-size:15px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--teal2);color:#fff;font:inherit;font-size:15px;cursor:pointer}
small{display:block;margin-top:12px;color:var(--sub);min-height:1.2em}
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="orb" aria-hidden="true"></span>
    <h1>Marty can't reach the PC</h1>
    <p>This device has no connection to the dashboard right now. Check the network and that Tailscale is connected, then try again.</p>
    <button id="retry" type="button">Try again</button>
    <small id="note" role="status"></small>
  </div>
</main>
<script>
(function () {
  var note = document.getElementById("note");
  function retry() { note.textContent = "Trying..."; location.reload(); }
  document.getElementById("retry").addEventListener("click", retry);
  window.addEventListener("online", retry);          // the network came back: try at once
})();
</script>
</body>
</html>
